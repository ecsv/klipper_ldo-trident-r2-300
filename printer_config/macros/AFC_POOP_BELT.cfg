[gcode_macro AFC_POOP_BELT]
description: Enable pin, run AFC_POOP, disable pin 2s after
gcode:
    # cancel any pending turn-off from a previous swap
    UPDATE_DELAYED_GCODE ID=_GOOSE_BELT_OFF DURATION=60
    SET_PIN PIN=goose_belt VALUE=0.25
    AFC_POOP {rawparams}
    M400                                   # wait until the purge moves are done
    UPDATE_DELAYED_GCODE ID=_GOOSE_BELT_OFF DURATION=30

[delayed_gcode _GOOSE_BELT_OFF]
gcode:
    SET_PIN PIN=goose_belt VALUE=0
