[gcode_macro START_PRINT]
description: Initialize print with Slicer settings
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(55)|float %}
    {% set EXTRUDER_STANDBY_TEMP = params.EXTRUDER_STANDBY_TEMP|default(150)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(195)|float %}
    {% set CHAMBER_TEMP = params.CHAMBER_TEMP|default(0)|float %}
    {% set SOAK = params.SOAK|default(0)|float %}
    {% set initial_tool = params.TOOL|default("0")|int %}

    G90 ; use absolute coordinates
    M83 ; extruder relative mode

    # clear old states
    CLEAR_PAUSE
    SET_SKEW CLEAR=1               ; never probe through a stale skew profile
    SET_GCODE_OFFSET Z=0 MOVE=0    ; drop babystepping left over from the last print
    BED_MESH_CLEAR
    M220 S100                      ; reset speed factor
    M221 S100                      ; reset extrusion factor
    M107                           ; part cooling fan off

    # Start bed heating
    M140 S{BED_TEMP}
    # Start extruder heating (standby temperature)
    M104 S{EXTRUDER_STANDBY_TEMP}
    # Tap triggers on the nozzle, so home at a repeatable nozzle temperature
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={EXTRUDER_STANDBY_TEMP} MAXIMUM={EXTRUDER_STANDBY_TEMP + 5}

    # Home the printer
    _START_PRINT_ECHO MSG="Homing"
    status_homing
    G28                            ; home all axes
    G90                            ; absolute positioning

    G1 Z20 F3000                   ; move nozzle away from bed
    AFC_PARK

    # Wait for bed to reach temperature
    _START_PRINT_ECHO MSG="Heating bed"
    status_heating
    TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={BED_TEMP} MAXIMUM={BED_TEMP + 2}
    {% if CHAMBER_TEMP > 0 %}
        _START_PRINT_ECHO MSG="Waiting for chamber"
        TEMPERATURE_WAIT SENSOR="temperature_sensor chamber_temp" MINIMUM={CHAMBER_TEMP}
    {% endif %}
    {% if SOAK > 0 %}
        _START_PRINT_ECHO MSG="Soaking for {SOAK} minutes"
        G4 P{SOAK * 60000}
    {% endif %}

    # Clean the tip before anything is probed with it
    status_cleaning
    AFC_BRUSH

    # Level the gantry at printing temperature, the frame has moved since boot
    _START_PRINT_ECHO MSG="Leveling"
    status_leveling
    Z_TILT_ADJUST
    G28 Z                          ; re-home Z against the leveled gantry

    status_meshing
    BED_MESH_CALIBRATE ADAPTIVE=1

    # load skew profile
    SKEW_PROFILE LOAD=calilantern_skew_profile
    # Heating nozzle
    _START_PRINT_ECHO MSG="Heating nozzle"
    status_heating
    # G1 X299 Y3 Z50 F3600
    M109 S{EXTRUDER_TEMP}
    T{initial_tool} #Load Initial Tool

    _START_PRINT_ECHO MSG="Purge"
    G90                            ; absolute positioning
    LINE_PURGE
    _START_PRINT_ECHO MSG="Printing"
    status_printing

[gcode_macro _START_PRINT_ECHO]
gcode:
    {% set msg = params.MSG %}
    {action_respond_info(msg)}
