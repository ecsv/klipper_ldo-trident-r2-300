[gcode_macro GOOSE_PURGE_TOOLCHANGE]
description: GOOSE_PURGE with extra length for the filament left in the hotend after a cut
# Extra length added on top of PURGE_LENGTH (mm)
# (which would be enough to force "non-mixed" filament out)
variable_extra_length: 50
# Used when PURGE_LENGTH isn't passed. Set this to GOOSE_PURGE's own default.
variable_default_purge_length: 50
gcode:
    {% set base = params.PURGE_LENGTH|default(default_purge_length)|float %}
    {% set ns = namespace(args="") %}
    {% for key, value in params.items() %}
        {% if key != "PURGE_LENGTH" %}
            {% if " " in value|string %}
                {% set ns.args = ns.args ~ " " ~ key ~ '="' ~ value ~ '"' %}
            {% else %}
                {% set ns.args = ns.args ~ " " ~ key ~ "=" ~ value %}
            {% endif %}
        {% endif %}
    {% endfor %}
    GOOSE_PURGE{ns.args} PURGE_LENGTH={"%.2f" % (base + extra_length)}
