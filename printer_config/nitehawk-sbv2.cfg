# This file contains pin mappings for the LDO Nitehawk-SB V2 Toolboard
# Make sure to include this config *at the end* of printer.cfg to overwrite the relevent sections

# See http://docs.ldomotors.com/toolboard/nitehawk-sbv2#firmware-setup-and-update
# For instructions on uploading/updating klipper firmware to the onboard MCU

# Klipper make menuconfig options:
# Processor model: STM32G0B1
# Bootloader offset (for Katapult): 8KiB bootloader
# Clock Reference: 12Mhz crystal
# Communication interface: USB (on PA11/PA12)


## LDO Nitehawk-SB V2 Toolboard Partial Config

## *** THINGS TO CHANGE/CHECK: ***
## MCU paths                            [mcu] section
## Endstop pins to enable or disable    [stepper_x] and [stepper_y] sections
## Extruder motor current               [tmc2209 extruder] section
## Chamber thermistor type              [temperature_sensor chamber_temp] section

## *MAKE SURE* to include this partial config file *AFTER* the main controller config. 
## This will ensure the relavent sections are overwritten by the picobilical mappings specified here.

[mcu nhk]
##  Obtain definition by "ls -l /dev/serial/by-id/" then unplug to verify
##--------------------------------------------------------------------
serial:/dev/serial/by-id/usb-Klipper_stm32g0b1xx_190034000450303857383820-if00
restart_method: command
##--------------------------------------------------------------------


#####################################################################
#   Endstops
#####################################################################
## XES - Toolhead PCB
#[stepper_x]
#endstop_pin: nhk:PB0

## YES - Toolhead PCB
#[stepper_y]
#endstop_pin: nhk:PB1


#####################################################################
# 	Extruder
#####################################################################
[extruder]
step_pin: nhk:PB8
dir_pin: nhk:PB9
enable_pin: !nhk:PC14
##  Update value below when you perform extruder calibration
##  If you ask for 100mm of filament, but in reality it is 98mm:
##  rotation_distance = <previous_rotation_distance> * <actual_extrude_distance> / 100
##  22.6789511 is a good starting point
rotation_distance: 22.6789511   #Bondtech 5mm Drive Gears
##  Update Gear Ratio depending on your Extruder Type
##  Use 50:10 for Stealthburner/Clockwork 2
##  Use 50:17 for Afterburner/Clockwork (BMG Gear Ratio)
##  Use 80:20 for M4, M3.1
gear_ratio: 50:10               #BMG Gear Ratio
microsteps: 32
full_steps_per_rotation: 200    #200 for 1.8 degree, 400 for 0.9 degree
nozzle_diameter: 0.400
filament_diameter: 1.75
heater_pin: nhk:PA7
## Check what thermistor type you have. See https://www.klipper3d.org/Config_Reference.html#common-thermistors for common thermistor types.
## Use "Generic 3950" for NTC 100k 3950 thermistors
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: nhk:PB12
pullup_resistor: 2200
min_temp: 10
max_temp: 270
max_power: 1.0
min_extrude_temp: 170
control = pid
pid_kp = 26.213
pid_ki = 1.304
pid_kd = 131.721
##  Try to keep pressure_advance below 1.0
#pressure_advance: 0.05
##  Default is 0.040, leave stock
#pressure_advance_smooth_time: 0.040

[tmc2209 extruder]
sense_resistor: 0.100
uart_pin: nhk:PB7
tx_pin: nhk:PB6
#diag_pin: nhk:PC13
interpolate: false
run_current: 0.5     #recommend setting below 0.7A.


#####################################################################
#   Fans
#####################################################################
## PCF
[fan] 
pin: nhk:PA15
tachometer_pin: nhk:PD2
tachometer_ppr: 2

## HEF
[heater_fan hotend_fan] 
pin: nhk:PD0
tachometer_pin: nhk:PD1
tachometer_ppr: 2
heater: extruder
heater_temp: 50.0
fan_speed: 1.0


#####################################################################
# 	Probe
#####################################################################
## Probe Port
# TODO
#[probe]
#pin: nhk:PC15


#####################################################################
#   Lights
#####################################################################
##Stealthburner Headlights
[neopixel sb_leds]
pin: nhk:PD3
chain_count: 3
color_order: GRBW
initial_RED: 0.0
initial_GREEN: 0.0
initial_BLUE: 0.0
initial_WHITE: 0.0

[output_pin act_led]
pin: nhk:PC6


#####################################################################
#   Accelerometer
#####################################################################
[adxl345]
cs_pin: nhk:PB10
spi_software_sclk_pin: nhk:PA5
spi_software_mosi_pin: nhk:PA2
spi_software_miso_pin: nhk:PA6

[resonance_tester]
accel_chip: adxl345
accel_per_hz: 100
sweeping_accel: 400
sweeping_period: 0
probe_points:
    155, 155, 20

#####################################################################
#   Thermistors
#####################################################################
[temperature_sensor chamber_temp]
sensor_type: Generic 3950
sensor_pin: nhk:PB2
pullup_resistor: 4700
min_temp: 0
max_temp: 100
gcode_id: chamber_th


#####################################################################
#   I2C port
